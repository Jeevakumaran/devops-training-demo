<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Training - Demo App</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1B1B2F;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #252545;
            border: 2px solid #009BF5;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #00D4AA; margin-bottom: 10px; }
        p  { color: #BBBBCC; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #009BF5;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            margin: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 DevOps Training</h1>
        <p>Welcome to our demo application!<br>
           This page was built to practice Git workflows.</p>
        <br>
        <span class="badge">Git</span>
        <span class="badge">GitHub</span>
        <span class="badge">DevOps</span>
        <span class="badge">CI/CD</span>
        <br><br>
        <p><em>Built with ❤️ during training</em></p>
    </div>
</body>
</html>
